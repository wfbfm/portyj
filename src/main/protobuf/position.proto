syntax = "proto3";

package portyj.positions;

option java_package = "com.wfbfm.portyj.positions";
option java_multiple_files = true;

message SubscriptionMsg {
  SubscriptionType subscriptionType = 1;
  repeated int64 ids = 2;
  repeated string isins = 3;
  repeated string accountTypes = 4;
}

enum SubscriptionType {
  UNDEFINED = 0;
  LIVE = 1;
  SNAPSHOT = 2;
}

message WsMsg {
  oneof payload {
    Position position = 1;
  }
}

message Position {
  int64 id = 1;
  string isin = 2;
  string assetName = 3;
  string accountType = 4;
  string quantity = 5;
  string purchasePrice = 6;
  string currentPrice = 7;
  string lastClose = 8;
  string totalPnl = 9;
  string dailyPnl = 10;
  string percentChange = 11;
}